# 실행 명령어: sudo docker compose --env-file .env up -d --build
# 중지 명령어: sudo docker compose down
# 로그 확인: sudo docker compose logs -f postgres

version: '3.8'

services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:16-alpine
    container_name: mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: card_qna_db
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: ${MCP_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      # 초기화 스크립트 마운트
      - ./data/qna/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql
      # 데이터 영속성 (선택 사항)
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_user -d card_qna_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (PostgreSQL 관리 도구, 선택 사항)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mcp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - mcp-network

volumes:
  postgres_data:
    driver: local

networks:
  mcp-network:
    driver: bridge
